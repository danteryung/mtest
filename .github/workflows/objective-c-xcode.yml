name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    runs-on: macos-latest

    steps:
      ##############################################################
      # 1. 소스체크아웃
      ##############################################################
      - name: Checkout
        uses: actions/checkout@v4


      ##############################################################
      # 2. 환경변수
      # 2-1. iOS프로젝트 경로 찾기
      ##############################################################
      - name: Locate ios project directory
        run: |
          echo "IOS_PROJECT_PATH=$(dirname $(find . -maxdepth 5 -name '*.xcodeproj' | head -n 1))" >> $GITHUB_ENV


      ##############################################################
      # 2-2. Scheme 값 추출
      ##############################################################    
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default
        working-directory: ${{ env.IOS_PROJECT_PATH }}


      ##############################################################
      # 2-3. CocoaPods 의존성 설치 (Podfile이 있을 경우)
      ##############################################################
      # - name: Install CocoaPods Dependencies
      #   run: pod install
      #   working-directory: ${{ env.IOS_PROJECT_PATH }}




      ##############################################################
      # 3. 환경 구축
      # 3-1 키체인 초기화 - 임시 키체인 생성
      ##############################################################    
      - name: Configure Keychain 
        run: |
          echo "Creating build keychain..."
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain


      ##############################################################
      # 3-2. 인증서 설치
      ##############################################################    
      - name: Import Certificate
        run: |
          echo "Decoding certificate from Secrets..."
          echo "${{ secrets.CERTIFICATE_BASE64 }}" | base64 --decode > certificate.p12

          echo "Importing certificate..."
          security import certificate.p12 -k build.keychain -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain


      ##############################################################
      # 3-3. 프로비저닝 프로파일 설치
      ##############################################################
      - name: Install Provisioning Profile from PROFILE* secrets
        run: |
          echo "Installing provisioning profile..."
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "🔍 PROFILE* 환경변수 목록 추출"
          for var in $(printenv | grep '^PROFILE' | cut -d= -f1); do
            echo "• 처리 중: $var"

            # 1) Base64 디코딩하여 임시 .mobileprovision 파일 생성
            echo "${!var}" | base64 --decode > temp.mobileprovision

            # 2) security cms 를 이용해 plist로 디코딩
            security cms -D -i temp.mobileprovision -o temp.plist

            # 3) Plist에서 UUID 추출
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' temp.plist)
            echo "  → profile UUID: $uuid"

            # 4) 최종 위치로 복사
            cp temp.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.mobileprovision

            # 5) 임시 파일 정리
            rm temp.mobileprovision temp.plist
          done


      ##############################################################
      # 4. 앱 빌드
      ##############################################################    
      - name: Build
        env:
          scheme: ${{ 'default' }}
        run: |
          ls
          cd mtest/native/ios/project
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild clean archive -scheme "$scheme" -archivePath "${{ github.workspace }}/build/"$scheme".xcarchive"




